<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d3c2b"/>
    <stop offset="0.55" stop-color="#06261a"/>
    <stop offset="1" stop-color="#03150e"/>
  </linearGradient>
  <radialGradient id="glow" cx="30%" cy="18%" r="80%">
    <stop offset="0" stop-color="#2c6c51" stop-opacity=".36"/>
    <stop offset=".55" stop-color="#2c6c51" stop-opacity=".08"/>
    <stop offset="1" stop-color="#2c6c51" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0ddb2"/>
    <stop offset=".42" stop-color="#cda96a"/>
    <stop offset="1" stop-color="#9f7b42"/>
  </linearGradient>
</defs>

<rect width="1024" height="1024" fill="url(#bg)"/>
<rect width="1024" height="1024" fill="url(#glow)"/>

<!-- restrained club-badge border -->
<circle cx="512" cy="512" r="408" fill="none" stroke="url(#gold)" stroke-width="16" opacity=".95"/>
<circle cx="512" cy="512" r="376" fill="none" stroke="#f5e8c9" stroke-width="2" opacity=".25"/>

<!-- sweeping fairway line -->
<path d="M198 772 C338 688 478 673 604 694 C720 714 798 695 846 640"
      fill="none" stroke="#b88f51" stroke-width="10" stroke-linecap="round" opacity=".42"/>
<path d="M212 802 C360 730 504 724 632 746 C746 766 820 748 862 702"
      fill="none" stroke="#f3e4c5" stroke-width="3" stroke-linecap="round" opacity=".18"/>

<!-- F monogram -->
<g>
  <path d="M300 280 H576 V360 H390 V470 H542 V548 H390 V742 H300 Z" fill="url(#gold)"/>
  <!-- inner highlight -->
  <path d="M317 298 H558 V319 H365 V488 H520 V508 H365 V724 H317 Z" fill="#f5e8c9" opacity=".11"/>
</g>

<!-- 1 as flagstick -->
<g>
  <path d="M646 305 L695 265 V748 H613 V330 Z" fill="url(#gold)"/>
  <path d="M684 274 H835 L788 334 L835 395 H684 Z" fill="url(#gold)"/>
  <circle cx="654" cy="777" r="58" fill="#f7f2e8"/>
  <circle cx="635" cy="760" r="5.5" fill="#d7d1c5" opacity=".9"/>
  <circle cx="664" cy="751" r="5" fill="#d7d1c5" opacity=".75"/>
  <circle cx="678" cy="782" r="5.5" fill="#d7d1c5" opacity=".8"/>
  <circle cx="644" cy="793" r="5" fill="#d7d1c5" opacity=".65"/>
</g>
</svg>